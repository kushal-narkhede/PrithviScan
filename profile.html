<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Profile — PrithviScan</title>
    <meta name="description" content="Manage your PrithviScan account." />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-bg" aria-hidden="true"></div>

    <header class="auth-top">
      <a class="auth-logo" href="index.html" aria-label="PrithviScan home">
        <img class="auth-logo-mark" src="assets/logo-mark.png" alt="" width="36" height="36" />
        <span>
          <span class="auth-logo-prithvi">Prithvi</span><span class="auth-logo-scan">Scan</span>
        </span>
      </a>
      <a class="auth-back" href="index.html">← Back to site</a>
    </header>

    <main class="auth-wrap">
      <section class="auth-panel profile-panel" aria-labelledby="profileTitle">
        <div class="auth-hero-logo">
          <img src="assets/logo.png" alt="" width="112" height="112" />
        </div>
        <p class="auth-kicker">Account</p>
        <h1 id="profileTitle" class="auth-heading">My Profile</h1>
        <p class="auth-sub">Your PrithviScan account details and session controls.</p>

        <div class="profile-avatar" id="profileAvatar" aria-hidden="true">U</div>
        <h2 class="profile-name" id="profileName">Loading…</h2>
        <p class="profile-email" id="profileEmail"></p>

        <dl class="profile-meta">
          <div>
            <dt>Signed in with</dt>
            <dd id="profileProvider">—</dd>
          </div>
          <div>
            <dt>Member since</dt>
            <dd id="profileCreated">—</dd>
          </div>
        </dl>

        <div class="profile-actions">
          <a class="auth-primary profile-home" href="app.html">Open my fields</a>
          <a class="auth-google profile-home" href="index.html">Go to homepage</a>
          <button id="signOutBtn" class="profile-signout" type="button">Sign out</button>
        </div>

        <p id="profileStatus" class="auth-msg" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="js/nav-auth.js"></script>
    <script type="module" src="js/profile-page.js"></script>
  </body>
</html>
