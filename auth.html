<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — PrithviScan</title>
    <meta
      name="description"
      content="Sign in or create a PrithviScan account with email or Google."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="index.html" aria-label="PrithviScan home">
          <span class="brand-prithvi">Prithvi</span><span class="brand-scan">Scan</span>
        </a>
        <a class="nav-text-link" href="index.html">Back to site</a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card reveal is-visible" aria-labelledby="authTitle">
        <p class="eyebrow">Account</p>
        <h1 id="authTitle" class="auth-title">
          Enter <span class="brand-prithvi dark">Prithvi</span><span class="brand-scan dark">Scan</span>
        </h1>
        <p class="auth-lead">
          Sign in to save fields, alerts, and recommendations as the intelligence layer grows.
        </p>

        <div
          id="setupNote"
          class="auth-setup"
          hidden
        >
          <strong>One setup step left.</strong>
          Enable Email/Password + Google in Firebase Authentication, register a Web app,
          then paste <code>apiKey</code> and <code>appId</code> into
          <code>js/firebase-config.js</code>.
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Auth mode">
          <button type="button" class="auth-tab is-active" data-auth-tab="signin" role="tab" aria-selected="true">
            Sign in
          </button>
          <button type="button" class="auth-tab" data-auth-tab="signup" role="tab" aria-selected="false">
            Create account
          </button>
        </div>

        <form id="authForm" class="auth-form" novalidate>
          <input type="hidden" id="authMode" name="mode" value="signin" />

          <label id="nameField" class="auth-field" hidden>
            <span>Full name</span>
            <input type="text" name="name" autocomplete="name" placeholder="Your name" />
          </label>

          <label class="auth-field">
            <span>Email</span>
            <input
              type="email"
              name="email"
              autocomplete="email"
              required
              placeholder="you@farm.com"
            />
          </label>

          <label class="auth-field">
            <span>Password</span>
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="6"
              placeholder="At least 6 characters"
            />
          </label>

          <button id="authSubmit" class="btn btn-primary auth-submit" type="submit">
            Sign in
          </button>
        </form>

        <div class="auth-divider" aria-hidden="true"><span>or</span></div>

        <button id="googleBtn" class="btn btn-google" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.86c2.26-2.08 3.58-5.14 3.58-8.64z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.86-3c-1.07.72-2.44 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.95H1.28v3.09A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.29A7.2 7.2 0 0 1 4.89 12c0-.8.14-1.57.38-2.29V6.62H1.28A12 12 0 0 0 0 12c0 1.94.46 3.77 1.28 5.38l3.99-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.43-3.43C17.94 1.19 15.23 0 12 0A12 12 0 0 0 1.28 6.62l3.99 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
          </svg>
          Continue with Google
        </button>

        <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="js/auth-page.js"></script>
  </body>
</html>
