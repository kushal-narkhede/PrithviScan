<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Field — PrithviScan</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="app-body">
    <header class="app-top">
      <div class="app-top-inner">
        <a class="brand" href="index.html" aria-label="PrithviScan home">
          <img class="brand-mark" src="assets/logo-mark.png" alt="" width="40" height="40" />
          <span class="brand-wordmark">
            <span class="brand-prithvi">Prithvi</span><span class="brand-scan">Scan</span>
          </span>
        </a>
        <nav class="app-nav" aria-label="App">
          <a href="app.html">Fields</a>
          <a href="app.html#alerts">Alerts</a>
          <span data-auth-slot></span>
        </nav>
      </div>
    </header>

    <main class="app-main">
      <div class="app-shell">
        <div class="field-top-row">
          <a class="app-back" href="app.html">← All fields</a>
          <button type="button" class="app-btn-danger" id="deleteFieldBtn">Delete field</button>
        </div>

        <header class="app-page-head">
          <div>
            <p class="app-kicker">Field detail</p>
            <h1 id="fieldTitle">Loading…</h1>
            <p class="app-lead" id="fieldMeta"></p>
          </div>
          <button type="button" class="app-btn-primary" id="refreshBtn">↻ Refresh insights</button>
        </header>

        <p id="fieldStatus" class="app-status" role="status" aria-live="polite"></p>

        <!-- Insight card -->
        <div class="insight-card-wrap" id="insightWrap">
          <div class="insight-card insight-info" id="insightCard">
            <p class="insight-level" id="insightLevel">—</p>
            <h2 class="insight-title" id="insightTitle">Loading insight…</h2>
            <p class="insight-message" id="insightMessage"></p>
            <ul class="insight-factors" id="insightFactors"></ul>
            <p class="insight-age" id="insightAge"></p>
          </div>
        </div>

        <!-- Metrics grid -->
        <div class="metrics-grid" id="metricsGrid" hidden>
          <div class="metric-card">
            <span class="metric-label">Rainfall (7d)</span>
            <span class="metric-value" id="mRain">—</span>
            <span class="metric-unit">mm</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Avg Temp</span>
            <span class="metric-value" id="mTemp">—</span>
            <span class="metric-unit">°C</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Max Temp</span>
            <span class="metric-value" id="mTempMax">—</span>
            <span class="metric-unit">°C</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Humidity</span>
            <span class="metric-value" id="mHumidity">—</span>
            <span class="metric-unit">%</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">ET demand (7d)</span>
            <span class="metric-value" id="mET">—</span>
            <span class="metric-unit">mm</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Solar radiation</span>
            <span class="metric-value" id="mSolar">—</span>
            <span class="metric-unit">kWh/m²/d</span>
          </div>
        </div>

        <!-- Satellite status -->
        <div class="satellite-row" id="satelliteRow" hidden>
          <span class="sat-label">Satellite data</span>
          <span class="sat-chip" id="satSMAP">SMAP —</span>
          <span class="sat-chip" id="satMODIS">MODIS —</span>
          <span class="sat-note" id="satNote"></span>
        </div>

        <!-- Map -->
        <div class="app-panel field-map-panel">
          <h2>Location</h2>
          <div id="detailMap" class="field-map field-map-detail" role="application" aria-label="Field location map"></div>
          <dl class="field-facts" id="fieldFacts"></dl>
        </div>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="js/nav-auth.js"></script>
    <script type="module" src="js/field-page.js"></script>
  </body>
</html>
